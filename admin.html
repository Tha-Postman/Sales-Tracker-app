const currencyFormatter = new Intl.NumberFormat("en-NG", {
    style: "currency",
    currency: "NGN",
    maximumFractionDigits: 0
});

function formatCurrency(value) {
    return currencyFormatter.format(Number(value || 0));
}

function escapeHtml(value = "") {
    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

function formatDate(value) {
    if (!value) return "-";

    const date = new Date(value);
    if (Number.isNaN(date.getTime())) return "-";

    return date.toLocaleDateString(undefined, {
        month: "short",
        day: "numeric",
        year: "numeric"
    });
}

function getInitials(name = "") {
    return String(name)
        .split(" ")
        .filter(Boolean)
        .slice(0, 2)
        .map(part => part[0].toUpperCase())
        .join("") || "U";
}

function getProfileForSale(sale) {
    return profiles.find(profile =>
        sale.user_id === profile.id
        ||
        sale.created_by === profile.full_name
        ||
        sale.created_by === profile.email
    );
}

function getRepNameForSale(sale) {
    const profile = getProfileForSale(sale);

    return profile?.full_name
        || sale.created_by
        || sale.rep_name
        || sale.email
        || "Unassigned";
}

function getSaleCartItems(sale) {
    if (!sale.cart) return [];

    if (Array.isArray(sale.cart)) return sale.cart;

    try {
        const parsed = JSON.parse(sale.cart);
        return Array.isArray(parsed) ? parsed : [];
    } catch(err) {
        return [];
    }
}

function getSaleProductsText(sale) {
    const items = getSaleCartItems(sale);

    if (items.length === 0) return sale.product || "No product listed";

    const visible = items.slice(0, 2).map(item =>
        `${item.product || "Product"} x${item.quantity || 1}`
    );

    const more = items.length - visible.length;

    return more > 0
        ? `${visible.join(", ")} +${more} more`
        : visible.join(", ");
}

function hasActiveSubscription(profile){

    if(!profile) return false;

    if(profile.subscription_status !== "active") return false;

    if(!profile.subscription_expires_at) return true;

    return new Date(profile.subscription_expires_at) > new Date();
}

// ADD PRODUCT

async function addProduct(){

    const name =
    document.getElementById("productName").value.trim();

    const price =
    Number(
        document.getElementById("productPrice").value
    );

    const stock =
    Number(
        document.getElementById("productStock").value
    );

    if(!name || Number.isNaN(price) || Number.isNaN(stock) || price < 0 || stock < 0){

        showNotification("Enter a valid product name, price, and stock");

        return;
    }
    

    const { error } =
    await supabaseClient
    .from("products")
    .insert([{

        name,

        price,

        stock_quantity: stock

    }]);

    if(error){

    console.log(error);

    // DUPLICATE PRODUCT
    if(error.code === "23505"){

        showNotification("Product already exists");

        return;
    }

    showNotification("Failed to add product");

    return;
}
    

    showNotification("Product added");

    clearProductForm();

    await loadProducts();
}

function clearProductForm(){

    const form = document.getElementById("productForm");

    if(form){
        form.reset();
    }

}

// FILTER PRODUCT

function filterProducts(){

    const search =
    document.getElementById("productSearch")
    .value
    .toLowerCase();

    const filtered =
    products.filter(product =>

        product.name
        .toLowerCase()
        .includes(search)
    );

    renderProducts(filtered);
}

// EDIT PRODUCT

async function editProduct(id){

    const product =
    products.find(p => p.id == id);

    if(!product) return;

    const newName =
    prompt("Edit product name:", product.name);

    if(newName === null) return;

    const newPrice =
    prompt("Edit product price:", product.price);

    if(newPrice === null) return;

    const newStock =
    prompt("Edit stock quantity:", product.stock_quantity);

    if(newStock === null) return;

    const { error } =
    await supabaseClient
    .from("products")
    .update({

        name: newName,

        price: Number(newPrice),

        stock_quantity: Number(newStock),

        available: Number(newStock) > 0
    })

    .eq("id", id);

    if(error){

        console.log(error);

        showNotification("Failed to update");

        return;
    }

        showNotification("Product updated");

    await loadProducts();
}

// EXPORT EXCEL

function exportExcel(){

    const rows = [];

    allCustomers.forEach(customer => {

        const base = {

            "Customer": customer.customer_id || "-",

            "Created By": customer.created_by || "System",

            "Payment Method": customer.payment_mode || "-",

            "Status": customer.status || "-",

            "Total Amount": customer.final_price || 0,

            "Date": customer.created_at
                ? new Date(customer.created_at).toLocaleDateString()
                : "-"
        };

        // IF CART EXISTS → EXPAND ITEMS
        if(Array.isArray(customer.cart) && customer.cart.length > 0){

            customer.cart.forEach(item => {

                rows.push({

                    ...base,

                    "Product": item.product || "-",

                    "Quantity": item.quantity || 0,

                    "Unit Price": item.price || 0,

                    "Line Total": item.total || 0
                });
            });

        } else {

            rows.push({

                ...base,

                "Product": "-",

                "Quantity": 0,

                "Unit Price": 0,

                "Line Total": 0
            });
        }
    });

    const worksheet =
    XLSX.utils.json_to_sheet(rows);

    const workbook =
    XLSX.utils.book_new();

    XLSX.utils.book_append_sheet(
        workbook,
        worksheet,
        "Sales Report"
    );

    XLSX.writeFile(
        workbook,
        "sales-report.xlsx"
    );
}

// EXPORT DOCX

async function exportDOCX(){

    const {
        Document,
        Packer,
        Paragraph,
        Table,
        TableRow,
        TableCell,
        WidthType,
        TextRun
    } = window.docx;

    const rows = [];

    // HEADER ROW
    rows.push(
        new TableRow({
            children: [
                "Customer",
                "Created By",
                "Product",
                "Qty",
                "Price",
                "Total",
                "Status",
                "Payment",
                "Date"
            ].map(text =>
                new TableCell({
                    children: [
                        new Paragraph({
                            children: [new TextRun({ text, bold: true })]
                        })
                    ]
                })
            )
        })
    );

    // DATA ROWS
    allCustomers.forEach(customer => {

        const cart = Array.isArray(customer.cart) && customer.cart.length > 0
            ? customer.cart
            : [{ product: "-", quantity: 0, price: 0, total: 0 }];

        cart.forEach(item => {

            rows.push(
                new TableRow({
                    children: [

                        customer.customer_id || "-",
                        customer.created_by || "System",
                        item.product || "-",
                        String(item.quantity || 0),
                        String(item.price || 0),
                        String(item.total || 0),
                        customer.status || "-",
                        customer.payment_mode || "-",
                        customer.created_at
                            ? new Date(customer.created_at).toLocaleDateString()
                            : "-"
                    ].map(text =>
                        new TableCell({
                            children: [
                                new Paragraph(text)
                            ]
                        })
                    )
                })
            );
        });
    });

    const doc = new Document({
        sections: [{
            children: [

                new Paragraph({
                    text: "Sales Report",
                    heading: "Heading1"
                }),

                new Table({
                    width: {
                        size: 100,
                        type: WidthType.PERCENTAGE
                    },
                    rows
                })
            ]
        }]
    });

    const blob =
    await Packer.toBlob(doc);

    saveAs(blob, "sales-report.docx");
}

// STATS

function updateStats(){

    let totalRevenue = 0;

    let paidRevenue = 0;

    let pendingRevenue = 0;

    let cancelledRevenue = 0;

    let paid = 0;

    let pending = 0;

    let cancelled = 0;

    // STAFF TRACKER
    const repSalesMap = {};

    allCustomers.forEach(c => {

        const amount =
        Number(c.final_price || 0);

        totalRevenue += amount;

        // TRACK STAFF SALES
        const repName =
        getRepNameForSale(c);

        if(!repSalesMap[repName]){

            repSalesMap[repName] = {
                sales: 0,
                revenue: 0
            };
        }

        repSalesMap[repName].sales += 1;

        repSalesMap[repName].revenue += amount;

        // STATUS COUNTS
        if(c.status === "Paid"){

            paid++;

            paidRevenue += amount;
        }

        if(c.status === "Pending"){

            pending++;

            pendingRevenue += amount;
        }

        if(c.status === "Cancelled"){

            cancelled++;

            cancelledRevenue += amount;
        }
    });

    // ========================
// TOP STAFF TRACKERS
// ========================

const weeklyMap = {};
const monthlyMap = {};
const yearlyMap = {};

const now = new Date();

allCustomers.forEach(c => {

    const amount =
    Number(c.final_price || 0);

    const rep =
    getRepNameForSale(c);

    const saleDate =
    new Date(c.created_at);

    // WEEK CHECK
    const diffDays =
    Math.floor(
        (now - saleDate) /
        (1000 * 60 * 60 * 24)
    );

    if(diffDays <= 7){

        if(!weeklyMap[rep]){
            weeklyMap[rep] = 0;
        }

        weeklyMap[rep] += amount;
    }

    // MONTH CHECK
    if(
        saleDate.getMonth() === now.getMonth()
        &&
        saleDate.getFullYear() === now.getFullYear()
    ){

        if(!monthlyMap[rep]){
            monthlyMap[rep] = 0;
        }

        monthlyMap[rep] += amount;
    }

    // YEAR CHECK
    if(
        saleDate.getFullYear() ===
        now.getFullYear()
    ){

        if(!yearlyMap[rep]){
            yearlyMap[rep] = 0;
        }

        yearlyMap[rep] += amount;
    }
});

// NOTIFICATION
function showNotification(message, type = "info"){

    const container =
    document.getElementById("notificationContainer");

    const div =
    document.createElement("div");

    const normalized = String(message).toLowerCase();

    if (type === "info") {
        if (normalized.includes("failed") || normalized.includes("error")) {
            type = "error";
        } else if (normalized.includes("low stock") || normalized.includes("out of stock")) {
            type = "warning";
        } else if (normalized.includes("added") || normalized.includes("updated") || normalized.includes("deleted") || normalized.includes("live")) {
            type = "success";
        }
    }

    const icons = {
        success: "fa-circle-check",
        error: "fa-circle-xmark",
        warning: "fa-triangle-exclamation",
        info: "fa-circle-info"
    };

    div.className = `notification ${type}`;

    div.innerHTML = `
        <span class="notification-icon"><i class="fa-solid ${icons[type] || icons.info}"></i></span>
        <span class="notification-message">${escapeHtml(message)}</span>
        <button type="button" class="notification-close" aria-label="Dismiss notification">
            <i class="fa-solid fa-xmark"></i>
        </button>
        <span class="notification-progress"></span>
    `;

    container.appendChild(div);

    div.querySelector(".notification-close").addEventListener("click", () => {
        div.classList.add("leaving");
        setTimeout(() => div.remove(), 220);
    });

    setTimeout(() => {
        div.classList.add("leaving");
        setTimeout(() => div.remove(), 220);
    }, 4500);
}

// ========================
// REP CARDS
// ========================

function loadRepStats(){

    const container =
    document.getElementById(
        "repStats"
    );

    container.innerHTML = "";

    // SHOW ADMINS + REPS
    const reps =
    profiles.filter(p =>

        p.role === "rep"

        ||

        p.role === "admin"
    );

    const repCountBadge = document.getElementById("repCountBadge");

    if (repCountBadge) {
        repCountBadge.textContent = `${reps.length} team members`;
    }

    reps.sort((a, b) => {
        const getRepRevenue = rep => allCustomers
            .filter(c => c.user_id === rep.id || c.created_by === rep.full_name)
            .reduce((sum, sale) => sum + Number(sale.final_price || 0), 0);

        return getRepRevenue(b) - getRepRevenue(a);
    });

    if (reps.length === 0) {
        container.innerHTML = `<p class="empty-state">No reps found</p>`;
        return;
    }

    reps.forEach(rep => {

        // MATCH SALES
        const sales =
        allCustomers.filter(c =>

            c.user_id === rep.id

            ||

            c.created_by === rep.full_name
        );

        // TOTALS
        let totalRevenue = 0;

        let paidSales = 0;

        let pendingSales = 0;

        let cancelledSales = 0;

        sales.forEach(sale => {

            totalRevenue +=
            Number(sale.final_price || 0);

            if(sale.status === "Paid"){
                paidSales++;
            }

            if(sale.status === "Pending"){
                pendingSales++;
            }

            if(sale.status === "Cancelled"){
                cancelledSales++;
            }
        });

        const paidRevenue = sales
            .filter(sale => sale.status === "Paid")
            .reduce((sum, sale) => sum + Number(sale.final_price || 0), 0);

        const averageSale = sales.length
            ? totalRevenue / sales.length
            : 0;

        const conversionRate = sales.length
            ? Math.round((paidSales / sales.length) * 100)
            : 0;

        const lastSaleDate = sales
            .map(sale => new Date(sale.created_at))
            .filter(date => !Number.isNaN(date.getTime()))
            .sort((a, b) => b - a)[0];

        const roleLabel = rep.role === "admin" ? "Admin" : "Sales Rep";

        // CARD
        const card =
        document.createElement("div");

        card.className =
        "rep-card";

        card.innerHTML = `
        <div class="rep-card-top">
            <div class="rep-avatar">${escapeHtml(getInitials(rep.full_name))}</div>

            <div class="rep-title">
                <h3>${escapeHtml(rep.full_name || "Unnamed")}</h3>
                <p>${escapeHtml(roleLabel)}</p>
            </div>

            <span class="rep-score">${conversionRate}% paid</span>
        </div>

        <div class="rep-highlight">
            <span>Total Revenue</span>
            <strong>${formatCurrency(totalRevenue)}</strong>
            <small>${sales.length} total sales · ${formatCurrency(averageSale)} avg sale</small>
        </div>

        <div class="rep-progress">
            <div class="rep-progress-bar" style="width:${conversionRate}%"></div>
        </div>

        <div class="rep-status-grid">
            <div class="rep-status paid">
                <strong>${paidSales}</strong>
                <span>Paid</span>
            </div>

            <div class="rep-status pending">
                <strong>${pendingSales}</strong>
                <span>Pending</span>
            </div>

            <div class="rep-status cancelled">
                <strong>${cancelledSales}</strong>
                <span>Cancelled</span>
            </div>
        </div>

        <div class="rep-meta">
            <span><i class="fa-solid fa-coins"></i> Paid revenue: ${formatCurrency(paidRevenue)}</span>
            <span><i class="fa-regular fa-clock"></i> Last sale: ${formatDate(lastSaleDate)}</span>
        </div>

        <button
        class="rep-action"
        onclick="viewRepSales('${rep.id}')">
            <span>View Sales</span>
            <i class="fa-solid fa-arrow-right"></i>
        </button>
        `;

        container.appendChild(card);
    });
}

function viewRepSales(repId){

    const modal = document.getElementById("repModal");

    const rep = profiles.find(profile => profile.id === repId);

    const sales = allCustomers.filter(c =>
        c.user_id === repId
        ||
        (rep && c.created_by === rep.full_name)
    );

    // 🔥 STORE DATA FOR SEARCH
    currentRepSales = sales
        .sort((a, b) => new Date(b.created_at || 0) - new Date(a.created_at || 0));

    const totalRevenue = currentRepSales
        .reduce((sum, sale) => sum + Number(sale.final_price || 0), 0);

    const paidSales = currentRepSales
        .filter(sale => sale.status === "Paid").length;

    const avgSale = currentRepSales.length
        ? totalRevenue / currentRepSales.length
        : 0;

    const title = document.getElementById("repModalTitle");
    const summary = document.getElementById("repModalSummary");

    if (title) {
        title.textContent = rep?.full_name || "Rep Sales";
    }

    if (summary) {
        summary.innerHTML = `
            <span>${currentRepSales.length} sales</span>
            <span>${paidSales} paid</span>
            <span>${formatCurrency(totalRevenue)} revenue</span>
            <span>${formatCurrency(avgSale)} avg</span>
        `;
    }

    // render once initially
    renderRepSales(currentRepSales);

    modal.style.display = "flex";

    document.getElementById("repSearchInput").value = "";
}

// CHART/REVENUE

function getRevenueData() {

    const daily = {};

    allCustomers.forEach(t => {

        if ((t.status || "").toLowerCase() !== "paid") return;

        const amount = Number(t.final_price || 0);
        const date = new Date(t.created_at);

        if (Number.isNaN(date.getTime())) return;

        const dayKey = date.toISOString().slice(0, 10);
        daily[dayKey] = (daily[dayKey] || 0) + amount;
    });

    const labels = Object.keys(daily).sort();
    const values = labels.map(label => daily[label]);

    return { labels, values };
}

// let revenueChart;

function renderRevenueChart() {

    const { labels, values } = getRevenueData();

    const canvas = document.getElementById("revenueChart");

    if (!canvas) return;

    if (revenueChart) revenueChart.destroy();

    revenueChart = new Chart(canvas.getContext("2d"), {
        type: "bar",
        data: {
            labels,

            datasets: [
                {
                    label: "Daily Revenue",
                    data: values,
                    borderWidth: 1,
                    backgroundColor: "rgba(37, 99, 235, 0.65)",
                    borderColor: "rgba(96, 165, 250, 1)",
                    borderRadius: 6
                }
            ]
        },
        options: {
        responsive: true,
        maintainAspectRatio: false,
        animation: {
        duration: 450,
        easing: "easeOutQuart"
    },
        scales: {
            y: {
                beginAtZero: true
            }
        },
        plugins: {
            legend: {
                display: false
            }
        }
}
        
    });
}

// SEARCH FUNCTION

function filterRepSales(){

    const input = document.getElementById("repSearchInput");

    if (!input) return;

    const query = input.value.toLowerCase().trim();

    const filtered = currentRepSales.filter(sale => {

        return (
            (sale.customer_id || "").toLowerCase().includes(query) ||
            (sale.status || "").toLowerCase().includes(query) ||
            (sale.payment_mode || "").toLowerCase().includes(query) ||
            (sale.source || "").toLowerCase().includes(query) ||
            getSaleProductsText(sale).toLowerCase().includes(query) ||
            String(sale.final_price || "").includes(query)
        );
    });

    renderRepSales(filtered);
}

// PAYMENT METHOD

function getPaymentMethods() {
    const methods = { cash: 0, transfer: 0, pos: 0 };

    allCustomers.forEach(t => {

        const method = (t.payment_mode || "").toLowerCase();

        if (t.status === "Paid") {

            if (methods[method] !== undefined) {
                methods[method] += Number(t.final_price || 0);
            }
        }
    });

    return methods;
}


// RENDER PAYMENT CHART

function renderPaymentChart() {
    const methods = getPaymentMethods();

    const values = [
        methods.cash,
        methods.transfer,
        methods.pos
    ];

    const canvas = document.getElementById("paymentChart");
    if (!canvas) return;

    if (paymentChart) {
        paymentChart.destroy();
        paymentChart = null;
    }

    if (values.every(v => v === 0)) {
        console.log("No payment data yet");
        return;
    }

    const ctx = canvas.getContext("2d");

    paymentChart = new Chart(ctx, {
        type: "doughnut",
        data: {
            labels: ["Cash", "Transfer", "POS"],
            datasets: [{
                data: values,
                backgroundColor: [
                    "rgba(34, 197, 94, 0.75)",
                    "rgba(37, 99, 235, 0.75)",
                    "rgba(250, 204, 21, 0.75)"
                ],
                borderColor: "#111827",
                borderWidth: 2
            }]
        },
        options: {
         responsive: true,
        maintainAspectRatio: false,
        animation: {
        duration: 450,
        easing: "easeOutQuart"
        },
        plugins: {
            legend: {
                position: "bottom"
            }
        }        
    }
});
}


// DELETE PRODUCT

async function deleteProduct(id){

    const confirmDelete =
    confirm("Delete this product?");

    if(!confirmDelete) return;

    const { error } =
    await supabaseClient
    .from("products")
    .delete()
    .eq("id", id);

    if(error){

        console.log(error);

        showNotification("Delete failed");

        return;
    }

    showNotification("🗑 Product deleted");

    await loadProducts();
}

function checkStockAlert(products) {

    products.forEach(p => {

        if (p.stock_quantity <= 0) {
            showNotification(`⚠️ ${p.name} is OUT OF STOCK`);
        }

        else if (p.stock_quantity <= 5) {
            showNotification(`⚠️ ${p.name} is LOW STOCK`);
        }
    });
}

// ========================
// START REALTIME
// ========================

function startAdminRealtime(){

    if(adminSalesChannel){
        supabaseClient.removeChannel(adminSalesChannel);
    }

    if(adminProductsChannel){
        supabaseClient.removeChannel(adminProductsChannel);
    }

    adminSalesChannel =
    supabaseClient
    .channel("admin-sales-live")
    .on(
        "postgres_changes",
        {
            event: "*",
            schema: "public",
            table: "customers"
        },
        payload => {
            console.log("Admin sales realtime:", payload.eventType);
            refreshDashboardSoon("New sales activity received");
        }
    )
    .subscribe(status => {
        console.log("Admin sales channel:", status);

        if(status === "CHANNEL_ERROR" || status === "TIMED_OUT"){
            showNotification("Realtime reconnecting...");
        }
    });

    adminProductsChannel =
    supabaseClient
    .channel("admin-products-live")
    .on(
        "postgres_changes",
        {
            event: "*",
            schema: "public",
            table: "products"
        },
        async () => {
            await loadProducts();
            showNotification("Products updated live");
        }
    )
    .subscribe(status => {
        console.log("Admin products channel:", status);
    });

    clearInterval(adminPollingTimer);

    adminPollingTimer = setInterval(() => {
        refreshDashboardSoon("Dashboard synced");
    }, 15000);
}
