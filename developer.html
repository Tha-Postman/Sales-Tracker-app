<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/svg+xml" href="img/favicon.svg">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#07111f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Sales Tracker">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Sales Tracker Developer</title>
    <link rel="stylesheet" href="developer.css">
    <script src="pwa.js" defer></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div id="notificationContainer"></div>

    <main class="dev-shell">
        <aside class="dev-sidebar">
            <div class="dev-brand">
                <span><i class="fa-solid fa-chart-simple"></i></span>
                <div>
                    <strong>Sales Tracker</strong>
                    <small>Developer Console</small>
                </div>
            </div>

            <button class="active" type="button" data-section-target="overview" onclick="scrollToSection('overview')">
                <i class="fa-solid fa-gauge-high"></i>
                Overview
            </button>
            <button type="button" data-section-target="businesses" onclick="scrollToSection('businesses')">
                <i class="fa-solid fa-building"></i>
                Businesses
            </button>
            <button type="button" data-section-target="activity" onclick="scrollToSection('activity')">
                <i class="fa-solid fa-clock-rotate-left"></i>
                Activity
            </button>
            <button type="button" data-section-target="tools" onclick="scrollToSection('tools')">
                <i class="fa-solid fa-screwdriver-wrench"></i>
                Tools
            </button>
            <button type="button" data-section-target="security" onclick="scrollToSection('security')">
                <i class="fa-solid fa-shield-halved"></i>
                Security
            </button>
            <button type="button" onclick="logout()">
                <i class="fa-solid fa-right-from-bracket"></i>
                Logout
            </button>
        </aside>

        <section class="dev-main">
            <header class="dev-topbar">
                <div>
                    <p>Platform Owner</p>
                    <h1>Developer Dashboard</h1>
                </div>
                <div class="dev-status">
                    <span></span>
                    Live operations
                </div>
            </header>

            <section id="overview" class="dev-section">
                <div class="section-head">
                    <div>
                        <p>System Health</p>
                        <h2>Overview</h2>
                    </div>
                    <button type="button" onclick="loadDeveloperDashboard()">
                        <i class="fa-solid fa-rotate"></i>
                        Refresh
                    </button>
                </div>
                <div id="metricsGrid" class="metrics-grid"></div>
                <div id="planGrid" class="plan-grid"></div>
            </section>

            <section id="businesses" class="dev-section">
                <div class="section-head">
                    <div>
                        <p>Tenants</p>
                        <h2>Businesses</h2>
                    </div>
                    <input id="businessSearch" type="search" placeholder="Search business, plan, status..." oninput="renderBusinesses()">
                </div>
                <div id="businessList" class="business-list"></div>
            </section>

            <section id="tools" class="dev-section">
                <div class="section-head">
                    <div>
                        <p>Owner Utilities</p>
                        <h2>Developer Tools</h2>
                    </div>
                </div>
                <form id="pricingEditor" class="pricing-editor" onsubmit="savePlatformPricing(event)">
                    <label>Starter monthly
                        <input id="priceStarter" type="number" min="1" step="1" oninput="renderPricingEquivalents()">
                    </label>
                    <label>Business monthly
                        <input id="priceBusiness" type="number" min="1" step="1" oninput="renderPricingEquivalents()">
                    </label>
                    <label>Pro monthly
                        <input id="pricePro" type="number" min="1" step="1" oninput="renderPricingEquivalents()">
                    </label>
                    <button type="submit"><i class="fa-solid fa-floppy-disk"></i> Save Pricing</button>
                </form>
                <div class="pricing-equivalents" id="pricingEquivalents"></div>

                <div class="dev-tools-grid">
                    <button type="button" onclick="checkApiHealth()"><i class="fa-solid fa-heart-pulse"></i> Check API Health</button>
                    <button type="button" onclick="exportBusinessesCSV()"><i class="fa-solid fa-file-csv"></i> Export Businesses CSV</button>
                    <button type="button" onclick="copyApiUrl()"><i class="fa-solid fa-link"></i> Copy API URL</button>
                    <button type="button" onclick="openPricingPage()"><i class="fa-solid fa-tags"></i> Open Pricing</button>
                </div>
                <div id="developerInsight" class="developer-insight"></div>
            </section>


            <section id="security" class="dev-section">
                <div class="section-head">
                    <div>
                        <p>Account Security</p>
                        <h2>Password</h2>
                    </div>
                </div>

                <form id="developerPasswordForm" class="security-form" onsubmit="changeDeveloperPassword(event)">
                    <label>
                        Current password
                        <input id="developerCurrentPassword" type="password" autocomplete="current-password" required>
                    </label>

                    <label>
                        New password
                        <input id="developerNewPassword" type="password" autocomplete="new-password" minlength="6" required>
                    </label>

                    <label>
                        Confirm password
                        <input id="developerConfirmPassword" type="password" autocomplete="new-password" minlength="6" required>
                    </label>

                    <button type="submit">
                        <i class="fa-solid fa-key"></i>
                        Update Password
                    </button>
                </form>
            </section>

            <section id="activity" class="dev-section">
                <div class="section-head">
                    <div>
                        <p>Control Log</p>
                        <h2>Platform Activity</h2>
                    </div>
                </div>
                <div id="activityList" class="activity-list"></div>
            </section>
        </section>
    </main>

<script>
const supabaseUrl = "https://nihqmpimzvhjglwkmhfl.supabase.co";
const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5paHFtcGltenZoamdsd2ttaGZsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc5MzM4MjgsImV4cCI6MjA5MzUwOTgyOH0.PU0egVoNGXsloErw5hGwb9JrLHnn02F1nh6jsudsJ8w";
function getBackendUrl(){
    const isDevHost = ["localhost", "127.0.0.1"].includes(window.location.hostname);
    const isBrowserDevServer = isDevHost && Boolean(window.location.port);
    return isBrowserDevServer
        ? "http://127.0.0.1:4242"
        : "https://sales-tracker-app-cd7k.onrender.com";
}
const API_URL = getBackendUrl();
const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

let allBusinesses = [];
let activity = [];
const currencyRates = {
    USD: { rate: 0.00067, label: "US Dollar" },
    GBP: { rate: 0.00053, label: "British Pound" },
    EUR: { rate: 0.00062, label: "Euro" },
    GHS: { rate: 0.010, label: "Ghana Cedi" },
    KES: { rate: 0.086, label: "Kenyan Shilling" },
    ZAR: { rate: 0.012, label: "South African Rand" }
};

function formatMoney(amount){
    return new Intl.NumberFormat(undefined, {
        style: "currency",
        currency: "NGN",
        maximumFractionDigits: 0
    }).format(Number(amount || 0));
}

function formatConvertedMoney(amount, currency){
    return new Intl.NumberFormat(undefined, {
        style: "currency",
        currency,
        maximumFractionDigits: currency === "USD" || currency === "GBP" || currency === "EUR" ? 2 : 0
    }).format(Number(amount || 0));
}

function showNotification(message, type = "info"){
    const container = document.getElementById("notificationContainer");
    const item = document.createElement("div");
    item.className = `notification ${type}`;
    item.textContent = message;
    container.appendChild(item);
    setTimeout(() => item.remove(), 3500);
}

async function getToken(){
    const { data: { session } } = await supabaseClient.auth.getSession();
    if(!session){
        window.location.href = "signin.html";
        return null;
    }
    return session.access_token;
}

async function devFetch(path, options = {}){
    const token = await getToken();
    if(!token) throw new Error("Login required");

    const response = await fetch(`${API_URL}${path}`, {
        ...options,
        headers: {
            "Content-Type": "application/json",
            Authorization: `Bearer ${token}`,
            ...(options.headers || {})
        }
    });

    const result = await response.json().catch(() => ({}));

    if(!response.ok){
        throw new Error(result.error || "Developer request failed");
    }

    return result;
}

async function loadDeveloperDashboard(){
    try {
        const [overview, businesses, activityResult] = await Promise.all([
            devFetch("/api/developer/overview"),
            devFetch("/api/developer/businesses"),
            devFetch("/api/developer/activity")
        ]);

        allBusinesses = businesses.businesses || [];
        activity = activityResult.activity || [];

        renderMetrics(overview.metrics || {});
        renderPlans(overview.plan_counts || {});
        renderBusinesses();
        renderActivity();
        renderDeveloperInsight(overview.metrics || {});
        await loadPlatformPricingEditor();
    } catch(error) {
        showNotification(error.message, "error");
        if(error.message.toLowerCase().includes("access")){
            setTimeout(() => window.location.href = "admin.html", 1200);
        }
    }
}

function renderMetrics(metrics){
    const cards = [
        ["Businesses", metrics.total_businesses, "fa-building"],
        ["Active", metrics.active_businesses, "fa-circle-check"],
        ["Users", metrics.total_users, "fa-users"],
        ["Sales", metrics.total_sales, "fa-receipt"],
        ["Paid Revenue", formatMoney(metrics.paid_revenue), "fa-money-bill-trend-up"],
        ["Low Stock", metrics.low_stock_products, "fa-box-open"],
        ["Suspended", metrics.suspended_businesses, "fa-ban"],
        ["Inactive", metrics.inactive_businesses, "fa-circle-xmark"]
    ];

    document.getElementById("metricsGrid").innerHTML = cards.map(([label, value, icon]) => `
        <article class="metric-card ${label === "Paid Revenue" ? "metric-card-revenue" : ""}">
            <i class="fa-solid ${icon}"></i>
            <span>${label}</span>
            <strong>${value ?? 0}</strong>
        </article>
    `).join("");
}

function renderPlans(planCounts){
    const plans = ["starter", "business", "pro", "enterprise"];
    document.getElementById("planGrid").innerHTML = plans.map(plan => `
        <article>
            <span>${plan}</span>
            <strong>${planCounts[plan] || 0}</strong>
        </article>
    `).join("");
}

function renderBusinesses(){
    const query = document.getElementById("businessSearch").value.toLowerCase().trim();
    const filtered = allBusinesses.filter(business => {
        const text = [
            business.business_name,
            business.plan,
            business.subscription_status,
            business.status
        ].join(" ").toLowerCase();

        return text.includes(query);
    });

    document.getElementById("businessList").innerHTML = filtered.map(business => {
        const status = business.status || business.subscription_status || "inactive";
        const displayStatus = status === "suspended" ? "suspended" : status;
        return `
            <article class="business-card ${displayStatus}">
                <div>
                    <span class="status-pill ${displayStatus}">${displayStatus}</span>
                    <h3>${business.business_name || "Unnamed business"}</h3>
                    <p>${business.plan || "No plan"} • expires ${business.subscription_expires_at ? new Date(business.subscription_expires_at).toLocaleDateString() : "not set"}</p>
                </div>
                <div class="business-metrics">
                    <span>${business.user_count || 0} users</span>
                    <span>${business.rep_count || 0} reps</span>
                    <span>${business.sale_count || 0} sales</span>
                    <span>${formatMoney(business.paid_revenue)}</span>
                </div>
                <div class="business-actions">
                    <button type="button" onclick="updateBusinessStatus('${business.id}', 'active')">Activate</button>
                    <button type="button" onclick="updateBusinessStatus('${business.id}', 'suspended')">Suspend</button>
                    <button type="button" class="danger" onclick="updateBusinessStatus('${business.id}', 'inactive')">Deactivate</button>
                </div>
            </article>
        `;
    }).join("") || `<div class="empty-state">No businesses found.</div>`;
}

async function updateBusinessStatus(id, status){
    try {
        await devFetch(`/api/developer/businesses/${id}/status`, {
            method: "POST",
            body: JSON.stringify({ status })
        });
        showNotification("Business status updated", "success");
        await loadDeveloperDashboard();
    } catch(error) {
        showNotification(error.message, "error");
    }
}

function renderActivity(){
    document.getElementById("activityList").innerHTML = activity.map(item => `
        <article>
            <strong>${item.action}</strong>
            <span>${item.actor_name || "Developer"} • ${item.created_at ? new Date(item.created_at).toLocaleString() : ""}</span>
            <small>${item.target_type || ""} ${item.target_id || ""}</small>
        </article>
    `).join("") || `<div class="empty-state">No platform activity yet.</div>`;
}

function renderDeveloperInsight(metrics){
    const panel = document.getElementById("developerInsight");
    if(!panel) return;
    const total = Number(metrics.total_businesses || 0);
    const suspended = Number(metrics.suspended_businesses || 0);
    const inactive = Number(metrics.inactive_businesses || 0);
    const active = Number(metrics.active_businesses || 0);
    const healthScore = total ? Math.round((active / total) * 100) : 0;
    panel.innerHTML = `<div><span>Platform health</span><strong>${healthScore}% active</strong><small>${suspended} suspended - ${inactive} inactive</small></div><div><span>Operations note</span><strong>${suspended ? "Review suspended tenants" : "No suspended tenants"}</strong><small>Use business cards to activate, suspend, or deactivate accounts.</small></div>`;
}

async function loadPlatformPricingEditor(){
    try {
        const result = await devFetch("/api/developer/pricing");
        const pricing = result.pricing || {};
        document.getElementById("priceStarter").value = pricing.starter?.monthly_ngn || pricing.starter?.monthlyNgn || 10000;
        document.getElementById("priceBusiness").value = pricing.business?.monthly_ngn || pricing.business?.monthlyNgn || 25000;
        document.getElementById("pricePro").value = pricing.pro?.monthly_ngn || pricing.pro?.monthlyNgn || 50000;
        renderPricingEquivalents();
    } catch(error) {
        showNotification(error.message, "error");
    }
}

function getPricingEditorValues(){
    return {
        starter: Number(document.getElementById("priceStarter")?.value || 0),
        business: Number(document.getElementById("priceBusiness")?.value || 0),
        pro: Number(document.getElementById("pricePro")?.value || 0)
    };
}

function renderPricingEquivalents(){
    const container = document.getElementById("pricingEquivalents");
    if(!container) return;

    const prices = getPricingEditorValues();
    const labels = {
        starter: "Starter",
        business: "Business",
        pro: "Pro"
    };

    container.innerHTML = Object.entries(prices).map(([plan, amount]) => `
        <article>
            <div>
                <span>${labels[plan]}</span>
                <strong>${formatMoney(amount)}</strong>
            </div>
            <ul>
                ${Object.entries(currencyRates).map(([currency, config]) => `
                    <li title="${config.label}">
                        <span>${currency}</span>
                        <strong>${formatConvertedMoney(amount * config.rate, currency)}</strong>
                    </li>
                `).join("")}
            </ul>
        </article>
    `).join("");
}

async function savePlatformPricing(event){
    event.preventDefault();
    try {
        const pricing = getPricingEditorValues();
        await devFetch("/api/developer/pricing", {
            method: "POST",
            body: JSON.stringify({
                pricing: {
                    starter: { monthly_ngn: pricing.starter },
                    business: { monthly_ngn: pricing.business },
                    pro: { monthly_ngn: pricing.pro }
                }
            })
        });
        renderPricingEquivalents();
        showNotification("Pricing updated", "success");
    } catch(error) {
        showNotification(error.message, "error");
    }
}

async function checkApiHealth(){
    try {
        const response = await fetch(`${API_URL}/api/health`);
        const result = await response.json();
        showNotification(result.ok ? "API health is OK" : "API health check returned an issue", result.ok ? "success" : "error");
    } catch(error) {
        showNotification("API health check failed", "error");
    }
}

function exportBusinessesCSV(){
    const headers = ["Business", "Plan", "Status", "Users", "Reps", "Sales", "Revenue"];
    const rows = allBusinesses.map(business => [business.business_name || "Unnamed business", business.plan || "", business.status || business.subscription_status || "inactive", business.user_count || 0, business.rep_count || 0, business.sale_count || 0, business.paid_revenue || 0]);
    const csv = [headers, ...rows].map(row => row.map(value => `"${String(value).replaceAll('"', '""')}"`).join(",")).join("\n");
    const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = "sales-tracker-businesses.csv";
    link.click();
    URL.revokeObjectURL(url);
}

async function copyApiUrl(){
    await navigator.clipboard.writeText(API_URL);
    showNotification("API URL copied", "success");
}

function openPricingPage(){
    window.open("pricing.html", "_blank", "noopener");
}


function setActiveDevNav(id){
    document.querySelectorAll(".dev-sidebar [data-section-target]").forEach(button => {
        const active = button.dataset.sectionTarget === id;
        button.classList.toggle("active", active);
        if(active){
            button.setAttribute("aria-current", "page");
        } else {
            button.removeAttribute("aria-current");
        }
    });
}

function setupDeveloperNavObserver(){
    const sections = document.querySelectorAll(".dev-section[id]");

    if(!("IntersectionObserver" in window) || sections.length === 0){
        setActiveDevNav("overview");
        return;
    }

    const observer = new IntersectionObserver(entries => {
        const visible = entries
            .filter(entry => entry.isIntersecting)
            .sort((a, b) => b.intersectionRatio - a.intersectionRatio)[0];

        if(visible?.target?.id){
            setActiveDevNav(visible.target.id);
        }
    }, {
        root: null,
        rootMargin: "-20% 0px -55% 0px",
        threshold: [0.12, 0.25, 0.5, 0.75]
    });

    sections.forEach(section => observer.observe(section));
}

function scrollToSection(id){
    setActiveDevNav(id);
    document.getElementById(id)?.scrollIntoView({ behavior: "smooth", block: "start" });
}


async function changeDeveloperPassword(event){
    event.preventDefault();

    const currentPassword = document.getElementById("developerCurrentPassword").value;
    const newPassword = document.getElementById("developerNewPassword").value;
    const confirmPassword = document.getElementById("developerConfirmPassword").value;
    const button = event.target.querySelector("button[type='submit']");

    if(newPassword.length < 6){
        showNotification("New password must be at least 6 characters", "error");
        return;
    }

    if(newPassword !== confirmPassword){
        showNotification("New passwords do not match", "error");
        return;
    }

    if(button) button.disabled = true;

    try {
        const { data: { user }, error: userError } = await supabaseClient.auth.getUser();

        if(userError || !user?.email){
            throw new Error("Login session expired");
        }

        const { error: verifyError } = await supabaseClient.auth.signInWithPassword({
            email: user.email,
            password: currentPassword
        });

        if(verifyError){
            throw new Error("Current password is not correct");
        }

        const { error: updateError } = await supabaseClient.auth.updateUser({
            password: newPassword
        });

        if(updateError) throw updateError;

        event.target.reset();
        showNotification("Developer password updated", "success");
    } catch(error) {
        showNotification(error.message, "error");
    } finally {
        if(button) button.disabled = false;
    }
}

async function logout(){
    await supabaseClient.auth.signOut();
    window.location.href = "signin.html";
}

setupDeveloperNavObserver();
setActiveDevNav("overview");
loadDeveloperDashboard();
</script>
</body>
