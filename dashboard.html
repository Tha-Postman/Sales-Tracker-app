async function isOnline(){

    if(!navigator.onLine){

        return false;
    }

    try {

        const timeout =
        new Promise((_, reject) => {

            setTimeout(
                () => reject(new Error("Connection check timed out")),
                3500
            );
        });

        await Promise.race([
            supabaseClient
            .from("products")
            .select("id")
            .limit(1),

            timeout
        ]);

        return true;

    } catch(err) {

        return false;
    }
}

// APPLY PERMISSIONS
function applyPermissions(role){

        });

}

function hasActiveSubscription(profile){

    if(!profile) return false;

    if(profile.subscription_status !== "active") return false;

    if(!profile.subscription_expires_at) return true;

    return new Date(profile.subscription_expires_at) > new Date();
}

function getBusinessId(){
    return currentProfile?.business_id || currentBusinessId;
}

function isProPlan(){
    return getPlanLevel(currentProfile?.subscription_plan) >= 3;
}

function getPlanLevel(plan){
    const normalized = String(plan || "").toLowerCase();

    if(normalized.includes("enterprise")) return 4;
    if(normalized.includes("pro")) return 3;
    if(normalized.includes("business")) return 2;
    if(normalized.includes("starter")) return 1;

    return 0;
}

function escapeHtml(value = ""){
    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

async function getAuthToken(){
    const {
        data: { session }
    } = await supabaseClient.auth.getSession();

    return session?.access_token || null;
}

async function teamApi(path, payload = null){
    const token = await getAuthToken();

    if(!token){
        throw new Error("Login session expired");
    }

    const options = {
        headers: {
            Authorization: `Bearer ${token}`
        }
    };

    if(payload){
        options.method = "POST";
        options.headers["Content-Type"] = "application/json";
        options.body = JSON.stringify(payload);
    }

    let response;

    try {
        response = await fetch(`${TEAM_API_URL}${path}`, options);
    } catch(error) {
        throw new Error("Team backend is not running");
    }

    const result = await response.json().catch(() => ({}));

    if(!response.ok){
        throw new Error(result.error || "Team request failed");
    }

    return result;
}

function bindRepChatForm(){
    const form = document.getElementById("repChatForm");

    if(!form || form.dataset.bound === "true") return;

    form.dataset.bound = "true";

    form.addEventListener("submit", async event => {
        event.preventDefault();

        const attachmentType = document.getElementById("repChatAttachmentType");
        const attachmentUrl = document.getElementById("repChatAttachmentUrl");

        try {
            await teamApi("/api/team/chat", {
                message: input.value,

                attachment_url: attachmentUrl.value
            });

            input.value = "";
            attachmentType.value = "";
            attachmentUrl.value = "";
            await loadRepChat();
        } catch(error) {

        }
    });
}

async function loadRepChat(){
    if(!isProPlan()) return;

    const messagesContainer = document.getElementById("repChatMessages");
    const status = document.getElementById("repChatStatus");

    if(!messagesContainer) return;

    try {
        const result = await teamApi("/api/team/chat");

        repChatSettings = result.settings || repChatSettings;

        if(status){
            status.textContent = repChatSettings.admin_only
                ? "Read-only mode: only admin can send messages."
                : "Team mode: reps can reply.";
        }

        const form = document.getElementById("repChatForm");
        const readOnly = repChatSettings.admin_only && currentUserRole !== "admin";

        if(form){
            form.querySelectorAll("input, select, button").forEach(control => {
                control.disabled = readOnly;
            });
        }

        renderRepChatMessages(result.messages || []);
    } catch(error) {
        messagesContainer.innerHTML = `<div class="empty-state">${error.message}</div>`;
    }
}

function renderRepChatMessages(messages){
    const container = document.getElementById("repChatMessages");

    if(!container) return;

    if(messages.length === 0){
        container.innerHTML = `<div class="empty-state">No team messages yet.</div>`;
        return;
    }

    container.innerHTML = messages.map(message => {
        const mine = message.sender_id === currentProfile?.id;
        const attachment = message.attachment_url
            ? `<a href="${escapeHtml(message.attachment_url)}" target="_blank" rel="noopener">${escapeHtml(message.attachment_type || "attachment")}</a>`
            : "";
        const reactions = renderRepReactionSummary(message);

        return `
            <div class="chat-message ${mine ? "mine" : ""}">
                <div class="chat-message-top">
                    <strong>${escapeHtml(message.sender_name || "Team member")}</strong>
                    <span>${escapeHtml(message.sender_role || "")}</span>
                </div>
                <p>${escapeHtml(message.message || "")}</p>
                ${attachment}
                ${reactions}
                <div class="chat-reactions">
                    <button type="button" onclick="reactToRepChatMessage('${message.id}', 'seen')">Seen</button>
                    <button type="button" onclick="reactToRepChatMessage('${message.id}', 'done')">Done</button>
                    <button type="button" onclick="reactToRepChatMessage('${message.id}', 'question')">Question</button>
                </div>
            </div>
        `;
    }).join("");

    container.scrollTop = container.scrollHeight;
}

function renderRepReactionSummary(message){
    const reactions = message.reactions || [];

    if(reactions.length === 0) return "";

    const counts = reactions.reduce((map, reaction) => {
        map[reaction.reaction] = (map[reaction.reaction] || 0) + 1;
        return map;
    }, {});

    return `
        <div class="chat-reaction-summary">
            ${counts.seen ? `<span>Seen ${counts.seen}</span>` : ""}
            ${counts.done ? `<span>Done ${counts.done}</span>` : ""}
            ${counts.question ? `<span>Questions ${counts.question}</span>` : ""}
        </div>
    `;
}

async function reactToRepChatMessage(messageId, reaction){
    try {
        await teamApi(`/api/team/chat/${messageId}/react`, { reaction });
        await loadRepChat();
    } catch(error) {
        showToast(error.message, "error");
    }
}

// UPDATE CART PRICES
function updateCartPrices(){

    cart = cart.map(item => {

        const product =
        productsMap[item.productId] ||
        products.find(p => p.name === item.product);

        if(!product) return item;

        const price = Number(product.price || 0);

        const total =
            (item.quantity * price) - (item.discount || 0);

        return {
            ...item,
            productId: product.id,
            price,
            total: Math.max(0, total)
        };
    });

    renderCart();
}

// =======================
// RENDER
// =======================

function getCartItems(cartData){

    if(!cartData) return [];

    if(typeof cartData === "string"){

        try {

            cartData = JSON.parse(cartData);

        } catch(err) {

            console.log("Cart parse error:", err);

            return [];
        }
    }

    return Array.isArray(cartData) ? cartData : [];
}

function formatMoney(amount){

    return `\u20a6${Number(amount || 0).toLocaleString()}`;
}

function getSaleAmount(sale){

    return Number(sale.final_price || sale.price || 0);
}

function getSaleDate(sale){

    const date = sale.created_at ? new Date(sale.created_at) : null;

    return date && !Number.isNaN(date.getTime()) ? date : null;
}

function getSaleProducts(sale){

    const cartItems = getCartItems(sale.cart);

    if(cartItems.length === 0){

        return sale.product || "-";
    }

    const visibleItems =
    cartItems.slice(0, 2).map(item =>
        `${item.product || "Unknown"} x${item.quantity || 1}`
    );

    const moreCount = cartItems.length - visibleItems.length;

    return moreCount > 0
        ? `${visibleItems.join(", ")} +${moreCount} more`
        : visibleItems.join(", ");
}

function startOfWeek(date){

    const start = new Date(date);

    const day = start.getDay();

    start.setHours(0, 0, 0, 0);

    start.setDate(start.getDate() - day);

    return start;
}

function isSameWeek(date, now){

    return startOfWeek(date).getTime() === startOfWeek(now).getTime();
}

function getPeriodKey(date, view){

    if(!date) return "No date";

    if(view === "weekly"){

        return date.toLocaleDateString(undefined, {
            weekday: "long",
            month: "short",
            day: "numeric"
        });
    }

    if(view === "monthly"){

        const weekNumber =
        Math.floor((date.getDate() - 1) / 7) + 1;

        return `Week ${weekNumber}`;
    }

    return date.toLocaleDateString(undefined, {
        month: "long",
        year: "numeric"
    });
}

function getHistoryData(data){

    const now = new Date();

    let filtered = [...data];

    if(currentHistoryView === "weekly"){

        filtered = filtered.filter(c => {

            const date = getSaleDate(c);

            return date && isSameWeek(date, now);
        });
    }

    if(currentHistoryView === "monthly"){

        filtered = filtered.filter(c => {

            const date = getSaleDate(c);

            return date &&
            date.getMonth() === now.getMonth() &&
            date.getFullYear() === now.getFullYear();
        });
    }

    if(currentHistoryView === "annual"){

        filtered = filtered.filter(c => {

            const date = getSaleDate(c);

            return date && date.getFullYear() === now.getFullYear();
        });
    }

    filtered.sort((a, b) => {

        const dateA = getSaleDate(a)?.getTime() || 0;
        const dateB = getSaleDate(b)?.getTime() || 0;

        return dateB - dateA;
    });

    if(currentHistoryView === "recent"){

        return filtered.slice(0, RECENT_SALES_LIMIT);
    }

    return filtered;
}

function buildHistoryGroups(data){

    if(currentHistoryView === "recent"){

        return [{
            title: "Recent Sales",
            sales: data
        }];
    }

    return data.reduce((groups, sale) => {

        const date = getSaleDate(sale);

        const key = getPeriodKey(date, currentHistoryView);

        if(!groups[key]){

            groups[key] = {
                title: key,
                sales: []
            };
        }

        groups[key].sales.push(sale);

        return groups;

    }, {});
}

function renderSaleCard(sale, index){

    const div = document.createElement("div");

    div.className = `card compact-card ${sale.status?.toLowerCase() || "unknown"}`;

    div.style.animationDelay = `${Math.min(index * 0.035, 0.35)}s`;

    const date =
    getSaleDate(sale)?.toLocaleString() || "-";

    div.innerHTML = `
        <div class="sale-card-top">
            <div>
                <strong>${sale.customer_id || "No ID"}</strong>
                <p>${getSaleProducts(sale)}</p>
            </div>
            <span class="status-pill">${sale.status || "-"}</span>
        </div>

        <div class="sale-card-meta">
            <span>Total: <strong>${formatMoney(getSaleAmount(sale))}</strong></span>
            <span>Discount: ${formatMoney(sale.discount || 0)}</span>
            <span>Payment: ${sale.payment_mode || "-"}</span>
            <span>${date}</span>
        </div>

        <div class="sale-card-actions">
            ${sale.status !== "Paid"
                ? `<button onclick="markPaid(${sale.id})">Mark Paid</button>`
                : `<span class="paid-tag">PAID</span>`
            }

            <button onclick="printReceipt(${sale.id})">Print Receipt</button>

            ${sale.status === "Cancelled"
            ? `<span class="cancelled-tag">Cancelled</span>`
            : `<button class="cancel" onclick="cancelSale(${sale.id})">Cancel Sale</button>`
            }

            <button class="delete admin-only" onclick="deleteCustomer(${sale.id})">
                Delete
            </button>
        </div>
    `;

    if(currentUserRole !== "admin"){

        div.querySelectorAll(".admin-only").forEach(btn => {

            btn.style.display = "none";
        });
    }

    return div;
}

function renderCustomers(data) {

    const list = document.getElementById("list");

    if (!list) {
        console.log("List container missing");
        return;
    }

    list.innerHTML = "";

    if (!Array.isArray(data)) {
        console.log("Data is not array");
        return;
    }

    let filtered = data;

    if(currentFilter !== "All"){

        filtered = data.filter(c =>
            (c.status || "")
            .toLowerCase()
            .trim()
            === currentFilter.toLowerCase()
        );
    }

    const historyData = getHistoryData(filtered);

    if(historyData.length === 0){

        list.innerHTML = `
            <div class="empty-state">
                No sales found for this view.
            </div>
        `;

        return;
    }

    const groups = buildHistoryGroups(historyData);

    Object.values(groups).forEach((group, groupIndex) => {

        const total = group.sales.reduce((sum, sale) =>
            sum + getSaleAmount(sale), 0
        );

        const section = document.createElement("details");

        section.className = "history-group";

        section.open = groupIndex === 0;

        section.innerHTML = `
            <summary>
                <span>${group.title}</span>
                <small>${group.sales.length} sales - ${formatMoney(total)}</small>
            </summary>
        `;

        const grid = document.createElement("div");

        grid.className = "history-list";

        group.sales.forEach((sale, index) => {

            grid.appendChild(
                renderSaleCard(sale, index)
            );
        });

        section.appendChild(grid);

        list.appendChild(section);
    });

    console.log("Customers rendered");
}

// SYNC OFFLINE STATUS CHANGES
async function syncOfflineQueue(){

    const queue =
    JSON.parse(localStorage.getItem("offlineQueue")) || [];

    if(queue.length === 0) return;

    const remaining = [];

    for(const item of queue){

        const { error } =
        await supabaseClient
        .from("customers")
        .update({
            status: item.status
        })
        .eq("id", item.id);

        if(error){

            console.log("QUEUE SYNC ERROR:", error);

            remaining.push(item);
        }
    }

    offlineQueue = remaining;

    if(remaining.length === 0){

        localStorage.removeItem("offlineQueue");

        showToast("Offline status changes synced", "success");

        return;
    }

    localStorage.setItem(
        "offlineQueue",
        JSON.stringify(remaining)
    );
}

function setPrice(){

    const select =
    document.getElementById("product");

    const selectedId =
    select.value;

    const selected =
    products.find(p => String(p.id) === String(selectedId));

    if(!selected){
        document.getElementById("price").value = "";
        calculateTotal();
        return;
    }

    document.getElementById("price").value =
    Number(selected.price || 0);

    calculateTotal();
}

function calculateTotal(){

    const quantity =
    Number(
        document.getElementById("quantity").value
    ) || 0;

    const price =
    Number(
        document.getElementById("price").value
    ) || 0;

    const discount =
    Number(
        document.getElementById("discount").value
    ) || 0;

    const total =
    (quantity * price) - discount;

    document.getElementById(
        "total_price"
    ).value =
    Math.max(0, total);
}

    );

    const total =
    (quantity * price) - discount;

    // CHECK IF PRODUCT ALREADY EXISTS
const existingItem = cart.find(
    item => String(item.productId) === String(productId)
);

if(existingItem){

    // UPDATE EXISTING ITEM
    existingItem.quantity += quantity;

    existingItem.discount += discount;

    existingItem.total =
    (existingItem.quantity * existingItem.price)
    - existingItem.discount;

} else {

    // ADD NEW ITEM
    cart.push({

// =======================
// TOAST
// =======================
function showToast(msg, type = "info") {
    const t = document.getElementById("toast");

    const normalized = String(msg).toLowerCase();

    if(type === "info"){
        if(normalized.includes("error") || normalized.includes("failed") || normalized.includes("required")){
            type = "error";
        } else if(normalized.includes("success") || normalized.includes("added") || normalized.includes("paid") || normalized.includes("synced") || normalized.includes("online")){
            type = "success";
        }
    }

    t.textContent = msg;
    t.className = `toast ${type}`;
    t.classList.add("show");

    setTimeout(() => t.classList.remove("show"), 2000);
}

function openPasswordModal(){
    const modal = document.getElementById("passwordModal");
    const oldPassword = document.getElementById("oldPassword");

    if(!modal) return;

    modal.classList.remove("hidden");
    if(oldPassword) oldPassword.focus();
}

function closePasswordModal(){
    const modal = document.getElementById("passwordModal");
    const form = document.getElementById("passwordForm");

    if(form) form.reset();
    if(modal) modal.classList.add("hidden");
}

function bindPasswordForm(){
    const form = document.getElementById("passwordForm");

    if(!form || form.dataset.bound === "true") return;

    form.dataset.bound = "true";

    form.addEventListener("submit", async event => {
        event.preventDefault();

        const oldPassword = document.getElementById("oldPassword").value;
        const newPassword = document.getElementById("newPassword").value;
        const confirmPassword = document.getElementById("confirmPassword").value;
        const button = form.querySelector(".password-save");
        const user = await getUser();

        if(!user?.email){
            showToast("Login session expired", "error");
            return;
        }

        if(newPassword.length < 6){
            showToast("New password needs 6+ characters", "error");
            return;
        }

        if(newPassword !== confirmPassword){
            showToast("New passwords do not match", "error");
            return;
        }

        if(oldPassword === newPassword){
            showToast("New password must be different", "error");
            return;
        }

        button.disabled = true;
        button.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Updating...`;

        try {
            const { error: verifyError } =
            await supabaseClient.auth.signInWithPassword({
                email: user.email,
                password: oldPassword
            });

            if(verifyError){
                showToast("Old password is incorrect", "error");
                return;
            }

            const { error } =
            await supabaseClient.auth.updateUser({
                password: newPassword
            });

            if(error){
                showToast(error.message, "error");
                return;
            }

            closePasswordModal();
            showToast("Password changed successfully", "success");
        } finally {
            button.disabled = false;
            button.innerHTML = `<i class="fa-solid fa-shield-halved"></i> Update Password`;
        }
    });
}

function updateDashboardClock(){
    const dateEl = document.getElementById("dashboardDate");

    if(!dateEl) return;

    const now = new Date();

    dateEl.textContent = now.toLocaleDateString(undefined, {
        weekday: "long",
        month: "short",
        day: "numeric",
        year: "numeric"
    });
}

document.addEventListener("click", event => {

    const logoutButton =
    document.querySelector(".logout-btn");

    if(!logoutButton) return;

    if(logoutButton.contains(event.target)) return;

    const rect =
    logoutButton.getBoundingClientRect();

    const clickedLogoutArea =
    event.clientX >= rect.left
    &&
    event.clientX <= rect.right
    &&
    event.clientY >= rect.top
    &&
    event.clientY <= rect.bottom;

    if(clickedLogoutArea){
        event.preventDefault();
        event.stopPropagation();
        logout();
    }
}, true);

// REALTIME PRODUCTS UPDATE

function startRealtime(){

    if(!navigator.onLine) return;

    if(realtimeStarted) return;

    // REMOVE OLD CHANNELS
    if(customerChannel){

        supabaseClient.removeChannel(
            customerChannel
        );
    }

    if(productChannel){

        supabaseClient.removeChannel(
            productChannel
        );
    }

    // ======================
    // CUSTOMERS
    // ======================

    customerChannel =
    supabaseClient
    .channel("customers-live")
    .on(
        "postgres_changes",
        {
            event: "*",
            schema: "public",
            table: "customers"
        },
        async (payload) => {

            console.log(
                "🔥 Customers updated"
            );

            const user = await getUser();
            const row = payload.new || payload.old || {};
            const businessId = getBusinessId();
            const isSameBusiness = !businessId || row.business_id === businessId;
            const isOwnSale = currentUserRole === "admin" || !user || row.user_id === user.id;

            if(isSameBusiness && isOwnSale){
                refreshSalesDashboardSoon("Sales history updated live");
            }
        }
    )
    .subscribe(status => {

        console.log(
            "CUSTOMER CHANNEL:",
            status
        );
    });

    // ======================
    // PRODUCTS
    // ======================

    productChannel =
    supabaseClient
    .channel("products-live")
    .on(
        "postgres_changes",
        {
            event: "*",
            schema: "public",
            table: "products"
        },
        async (payload) => {

            console.log(
                "🔥 Products updated"
            );

            const row = payload.new || payload.old || {};

            if(row.business_id && row.business_id !== getBusinessId()){
                return;
            }

            await loadProducts();

            setPrice();

            updateCartPrices();

            renderCart();
        }
    )
    .subscribe(status => {

        console.log(
            "PRODUCT CHANNEL:",
            status
        );
    });

    realtimeStarted = true;
}
